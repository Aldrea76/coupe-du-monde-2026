<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Calendrier & Classements</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0F1117;
    --surface:  #1A1D2E;
    --surface2: #222640;
    --surface3: #2A2F50;
    --indigo:   #6C63FF;
    --teal:     #00D4AA;
    --coral:    #FF6B6B;
    --amber:    #FFB347;
    --sky:      #38BDF8;
    --white:    #F0F2FF;
    --muted:    #7B82A8;
    --border:   rgba(255,255,255,0.07);
    --radius:   16px;
    --radius-sm:10px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { height: 4px; width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 99px; }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #0F1117 0%, #1a1030 60%, #0F1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    position: sticky; top: 0; z-index: 100;
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; align-items: center; gap: 1.25rem;
    padding: 0.85rem 0;
  }
  .trophy { font-size: 2rem; filter: drop-shadow(0 0 10px #FFB347); }
  .header-titles h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem; letter-spacing: 3px;
    background: linear-gradient(90deg, var(--white) 0%, var(--teal) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1;
  }
  .header-titles p {
    font-size: 0.62rem; color: var(--muted);
    letter-spacing: 3px; text-transform: uppercase; margin-top: 3px;
  }
  .header-badge {
    margin-left: auto;
    background: linear-gradient(135deg, var(--indigo), var(--teal));
    color: #fff; font-family: 'Bebas Neue', sans-serif;
    font-size: 0.95rem; letter-spacing: 2px;
    padding: 0.35rem 1rem; border-radius: 99px;
  }

  /* ── MAIN NAV ── */
  .main-nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 60px; z-index: 99;
  }
  .main-nav-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; gap: 0.25rem;
    overflow-x: auto; padding: 0.6rem 1.5rem;
    scrollbar-width: none;
  }
  .main-nav-inner::-webkit-scrollbar { display: none; }
  .nav-btn {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--muted);
    font-size: 0.7rem; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    padding: 0.4rem 1.1rem;
    border-radius: 99px;
    cursor: pointer; white-space: nowrap;
    transition: all 0.2s;
  }
  .nav-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.25); }
  .nav-btn.active {
    background: var(--indigo);
    border-color: var(--indigo);
    color: #fff;
  }
  .nav-btn.knockout.active {
    background: var(--coral);
    border-color: var(--coral);
    color: #fff;
  }

  /* ── SECONDARY NAV (dates / groupes) ── */
  .secondary-nav {
    max-width: 1400px; margin: 0 auto;
    padding: 0 1.5rem;
  }
  .secondary-tabs {
    display: flex; gap: 6px;
    overflow-x: auto; padding: 1rem 0 0;
    scrollbar-width: none;
  }
  .secondary-tabs::-webkit-scrollbar { display: none; }

  /* DATE TAB */
  .date-tab {
    flex-shrink: 0;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    padding: 0.6rem 0.9rem;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    text-align: center;
    transition: all 0.2s;
    min-width: 58px;
    position: relative;
  }
  .date-tab:hover { color: var(--white); background: var(--surface3); }
  .date-tab.active {
    background: var(--surface);
    border-color: var(--teal);
    border-bottom-color: var(--surface);
    color: var(--teal);
  }
  .date-tab .day-num { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; line-height:1; display:block; }
  .date-tab .day-name { font-size:0.55rem; letter-spacing:1px; text-transform:uppercase; display:block; }
  .date-tab .match-count {
    position:absolute; top:-5px; right:-5px;
    background: var(--coral); color:#fff;
    font-size:0.52rem; font-weight:700;
    width:15px; height:15px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }

  /* GROUP TAB */
  .group-tab {
    flex-shrink: 0;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    padding: 0.55rem 1.2rem;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    text-align: center;
    transition: all 0.2s;
    font-size: 0.75rem; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase;
    white-space: nowrap;
  }
  .group-tab:hover { color: var(--white); background: var(--surface3); }
  .group-tab.active {
    background: var(--surface);
    border-color: var(--amber);
    border-bottom-color: var(--surface);
    color: var(--amber);
  }

  /* ── CONTENT ── */
  main {
    max-width: 1400px; margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  .view-section { display: none; }
  .view-section.active { display: block; }

  /* ── DAY HEADER ── */
  .day-header {
    padding: 1.5rem 0 1rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .day-header h2 {
    font-family:'Bebas Neue',sans-serif;
    font-size:2rem; letter-spacing:3px;
  }
  .pill {
    background: var(--surface2);
    color: var(--muted);
    font-size:0.65rem; font-weight:600; letter-spacing:2px;
    padding:0.3rem 0.8rem; border-radius:99px;
    text-transform:uppercase;
  }

  /* ── MATCH CARD ── */
  .matches-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 0.8rem;
  }

  .match-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    position: relative; overflow: hidden;
  }
  .match-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    border-color: rgba(0,212,170,0.35);
  }
  .match-card.played { border-left: 3px solid var(--muted); }
  .match-card.live { border-left: 3px solid var(--coral); animation: glow-card 2s infinite; }

  @keyframes glow-card {
    0%,100% { box-shadow: 0 0 0 rgba(255,107,107,0); }
    50% { box-shadow: 0 0 18px rgba(255,107,107,0.25); }
  }

  .match-meta {
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .match-time {
    font-family:'Bebas Neue',sans-serif; font-size:1rem;
    letter-spacing:1px; color: var(--teal);
  }
  .match-time.live-col { color: var(--coral); }
  .tag {
    font-size:0.58rem; font-weight:700; letter-spacing:1.5px;
    text-transform:uppercase; padding:0.18rem 0.5rem; border-radius:99px;
    background: rgba(255,255,255,0.07); color: var(--muted);
  }
  .date-tag {
    background: rgba(108,99,255,0.15);
    color: #a99fff;
    border: 1px solid rgba(108,99,255,0.3);
  }
    background: var(--coral); color:#fff;
    font-size:0.58rem; font-weight:700; letter-spacing:1px;
    padding:0.15rem 0.5rem; border-radius:99px;
    animation: blink 1.2s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .match-teams { display:flex; align-items:center; gap:0.6rem; }
  .team { flex:1; display:flex; align-items:center; gap:0.5rem; }
  .team.away { flex-direction:row-reverse; text-align:right; }
  .team-flag { font-size:1.35rem; flex-shrink:0; }
  .team-name { font-size:0.78rem; font-weight:600; color:var(--white); line-height:1.2; }

  .score-box { display:flex; align-items:center; gap:3px; flex-shrink:0; }
  .score-num {
    font-family:'Bebas Neue',sans-serif; font-size:1.7rem; line-height:1;
    background: var(--surface3); color:var(--white);
    width:36px; height:40px; display:flex; align-items:center; justify-content:center;
    border-radius: 8px;
  }
  .score-sep { font-family:'Bebas Neue',sans-serif; font-size:1rem; color:var(--muted); }
  .score-tbd {
    font-size:0.75rem; font-weight:600; color:rgba(255,255,255,0.2);
    letter-spacing:1px; padding:0 0.5rem;
  }

  /* ── STANDINGS ── */
  .standings-wrap {
    padding: 1.5rem 0 0;
  }
  .standings-header {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  .standings-header h2 {
    font-family:'Bebas Neue',sans-serif;
    font-size:1.8rem; letter-spacing:3px;
  }

  .standings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1rem;
  }

  .standings-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .standings-card-header {
    padding: 0.85rem 1.1rem;
    display: flex; align-items: center; gap: 0.6rem;
    border-bottom: 1px solid var(--border);
  }
  .standings-card-header .group-letter {
    font-family:'Bebas Neue',sans-serif; font-size:1.3rem;
    color: var(--white); line-height:1;
  }
  .standings-card-header .group-name {
    font-size: 0.68rem; font-weight: 600;
    color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
  }
  .group-color-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    margin-left: auto;
  }

  .standings-table { width:100%; border-collapse:collapse; }
  .standings-table th {
    font-size:0.58rem; font-weight:700; letter-spacing:2px;
    text-transform:uppercase; color: var(--muted);
    padding:0.5rem 0.75rem; text-align:right;
    border-bottom: 1px solid var(--border);
  }
  .standings-table th:first-child { text-align:left; }
  .standings-table td {
    font-size:0.78rem; font-weight:500;
    padding:0.6rem 0.75rem; text-align:right;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .standings-table td:first-child { text-align:left; }
  .standings-table tr:last-child td { border-bottom:none; }
  .standings-table tr:hover td { background: rgba(255,255,255,0.03); }

  .team-cell { display:flex; align-items:center; gap:0.5rem; }
  .team-cell .pos {
    font-family:'Bebas Neue',sans-serif; font-size:1rem;
    color: var(--muted); width:16px; text-align:right;
  }
  .team-cell .pos.qualified { color: var(--teal); }
  .team-cell .pos.playoff { color: var(--amber); }
  .team-cell .mini-flag { font-size:1.1rem; }
  .team-cell .tname { font-size:0.75rem; font-weight:600; }

  .pts-cell {
    font-family:'Bebas Neue',sans-serif; font-size:1.2rem;
    color: var(--white);
  }
  .diff-pos { color: var(--teal); }
  .diff-neg { color: var(--coral); }
  .diff-zero { color: var(--muted); }

  .qual-legend {
    display:flex; gap:1rem; padding: 0.6rem 0.75rem;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
  }
  .qual-legend span {
    font-size:0.6rem; color:var(--muted);
    display:flex; align-items:center; gap:0.3rem;
  }
  .qual-dot {
    display:inline-block; width:7px; height:7px; border-radius:50%;
  }

  /* ── KNOCKOUT ── */
  .knockout-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 0.8rem;
  }
  .knockout-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-left: 3px solid var(--coral);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .knockout-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .knockout-card .match-time { color: var(--coral); }

  .section-title {
    font-family:'Bebas Neue',sans-serif;
    font-size:1.6rem; letter-spacing:3px;
    margin:1.5rem 0 1rem;
    display:flex; align-items:center; gap:0.75rem;
  }
  .section-title::after {
    content:''; flex:1; height:1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  /* ── GROUP COLORS ── */
  .gc-A { background:#6C63FF; } .gc-B { background:#00D4AA; }
  .gc-C { background:#FF6B6B; } .gc-D { background:#FFB347; }
  .gc-E { background:#38BDF8; } .gc-F { background:#A78BFA; }
  .gc-G { background:#34D399; } .gc-H { background:#F472B6; }
  .gc-I { background:#FB923C; } .gc-J { background:#4ADE80; }
  .gc-K { background:#F87171; } .gc-L { background:#60A5FA; }

  @media(max-width:640px) {
    .matches-grid { grid-template-columns:1fr; }
    .knockout-grid { grid-template-columns:1fr; }
    .standings-grid { grid-template-columns:1fr; }
    .header-titles h1 { font-size:1.3rem; }
  }
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header>
  <div class="header-inner">
    <div class="trophy">🏆</div>
    <div class="header-titles">
      <h1>FIFA World Cup 2026</h1>
      <p>Calendrier officiel · Résultats · Classements</p>
    </div>
    <div class="header-badge">USA · CAN · MEX</div>
  </div>
</header>

<!-- ═══ MAIN NAV ═══ -->
<div class="main-nav">
  <div class="main-nav-inner">
    <button class="nav-btn active"   onclick="switchMain('calendar',this)">📅 Calendrier</button>
    <button class="nav-btn"          onclick="switchMain('standings',this)">📊 Classements</button>
    <button class="nav-btn"          onclick="switchMain('scorers',this)">⚽ Buteurs</button>
    <button class="nav-btn knockout" onclick="switchMain('r16',this)">1/16 de finale</button>
    <button class="nav-btn knockout" onclick="switchMain('r8',this)">1/8 de finale</button>
    <button class="nav-btn knockout" onclick="switchMain('qf',this)">Quarts</button>
    <button class="nav-btn knockout" onclick="switchMain('sf',this)">Demis</button>
    <button class="nav-btn knockout" onclick="switchMain('final',this)">🏆 Finale</button>
  </div>
</div>

<!-- ═══ SECONDARY NAV (calendrier = dates, classements = groupes) ═══ -->
<div id="secondaryNavWrap">
  <div class="secondary-nav">
    <div class="secondary-tabs" id="secondaryTabs"></div>
  </div>
</div>

<!-- ═══ CONTENT ═══ -->
<main>
  <!-- CALENDRIER -->
  <div id="view-calendar" class="view-section active">
    <div id="dayPanels"></div>
  </div>

  <!-- CLASSEMENTS -->
  <div id="view-standings" class="view-section">
    <div id="standingsContent"></div>
  </div>

  <!-- BUTEURS -->
  <div id="view-scorers" class="view-section">
    <div id="scorersContent"></div>
  </div>

  <!-- KNOCKOUT -->
  <div id="view-knockout" class="view-section">
    <div id="knockoutContent"></div>
  </div>
</main>

const GROUPS = {

  // ── GROUPE D : États-Unis(0) Paraguay(1) Australie(2) Turquie(3)
  {date:'15 JUIN',  time:'15H',  home:0, away:1, group:'D'}, // États-Unis - Paraguay
  {date:'17 JUIN',  time:'17H',  home:2, away:3, group:'D'}, // Australie - Turquie

// STANDINGS COMPUTATION
// ═══════════════════════════════════════════════════════════
function computeStandings(groupId) {
  const g = GROUPS[groupId];
  const stats = g.teams.map((_,i)=>({idx:i,played:0,w:0,d:0,l:0,gf:0,ga:0}));

  MATCHES_GROUP.forEach((m,i) => {
    if(m.group !== groupId) return;
    const key = mKey(m,i);
    const res = results[key];
    if(!res || !res.hasOwnProperty('h')) return;
    const hi = m.home, ai = m.away;
    stats[hi].played++; stats[ai].played++;
    stats[hi].gf += res.h; stats[hi].ga += res.a;
    stats[ai].gf += res.a; stats[ai].ga += res.h;
    if(res.h > res.a) { stats[hi].w++; stats[ai].l++; }
    else if(res.h < res.a) { stats[ai].w++; stats[hi].l++; }
    else { stats[hi].d++; stats[ai].d++; }
  });

  return stats.map(s=>({
    ...s,
    pts: s.w*3 + s.d,
    diff: s.gf - s.ga,
  })).sort((a,b)=> b.pts-a.pts || b.diff-a.diff || b.gf-a.gf);
}

// MATCH CARD HTML
// ═══════════════════════════════════════════════════════════
function buildMatchCard(m, idx, isKnockout=false, showDate=false) {
  const key = mKey(m, idx);
  const res = results[key]||{};
  const played = res.hasOwnProperty('h');
  const isLive = res.live;

  let homeInfo, awayInfo;
  if(isKnockout){
    homeInfo={name:m.home,flag:'⚽'}; awayInfo={name:m.away,flag:'⚽'};
  } else {
    const g=GROUPS[m.group];
    homeInfo={name:g.teams[m.home],flag:g.flags[m.home]};
    awayInfo={name:g.teams[m.away],flag:g.flags[m.away]};
  }

  const cls = isKnockout?'knockout-card':`match-card${played?' played':''}${isLive?' live':''}`;
  const timeCol = isLive?'match-time live-col':'match-time';
  const phaseTag = isKnockout?(m.label||''):(m.group?`Groupe ${m.group}`:'');

  let scoreHtml;
  if(played && !isKnockout){
    scoreHtml=`<div class="score-box">
      <div class="score-num">${res.h}</div>
      <div class="score-sep">—</div>
      <div class="score-num">${res.a}</div>
    </div>`;
  } else {
    scoreHtml=`<div class="score-tbd">VS</div>`;
  }

  return `<div class="${cls}" onclick="openScore('${key}','${homeInfo.name.replace(/'/g,"\\'")}','${awayInfo.name.replace(/'/g,"\\'")}')">
    <div class="match-meta">
      ${showDate && m.date ? `<span class="tag date-tag">📅 ${m.date}</span>` : ''}
      <span class="${timeCol}">${m.time}</span>
      ${phaseTag?`<span class="tag">${phaseTag}</span>`:''}
      ${isLive?'<span class="live-badge">EN DIRECT</span>':''}
    </div>
    <div class="match-teams">
      <div class="team"><span class="team-flag">${homeInfo.flag}</span><span class="team-name">${homeInfo.name}</span></div>
      ${scoreHtml}
      <div class="team away"><span class="team-flag">${awayInfo.flag}</span><span class="team-name">${awayInfo.name}</span></div>
    </div>
  </div>`;
}

// BUILD CALENDAR — all days scrollable, today auto-highlighted
// ═══════════════════════════════════════════════════════════

// Map French date strings to JS Date for comparison
function parseMatchDate(dateStr) {
  // e.g. "16 JUIN" → June 16 2026
  const months = {JANVIER:0,FÉVRIER:1,MARS:2,AVRIL:3,MAI:4,JUIN:5,JUILLET:6,AOÛT:7,SEPTEMBRE:8,OCTOBRE:9,NOVEMBRE:10,DÉCEMBRE:11};
  const parts = dateStr.trim().split(' ');
  const day = parseInt(parts[0]);
  const month = months[parts[1]] ?? 5;
  return new Date(2026, month, day);
}

function getTodayStr() {
  const now = new Date();
  const months = ['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN','JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];
  return `${now.getDate()} ${months[now.getMonth()]}`;
}

function buildCalendar() {
  // Collect all unique dates from group matches, sorted chronologically
  const datesMap = {};
  MATCHES_GROUP.forEach((m,i) => {
    if (!datesMap[m.date]) datesMap[m.date] = [];
    datesMap[m.date].push({m, i});
  });

  // Sort dates chronologically
  const dates = Object.keys(datesMap).sort((a,b) => parseMatchDate(a) - parseMatchDate(b));

  const todayStr = getTodayStr();
  // Find today or closest future date
  let activeDate = dates.find(d => d === todayStr);
  if (!activeDate) {
    const today = new Date();
    // Find first upcoming date
    activeDate = dates.find(d => parseMatchDate(d) >= today) || dates[0];
  }

  // Day names in French, June 1 2026 = Monday
  const dayNames = ['DIM','LUN','MAR','MER','JEU','VEN','SAM'];

  const tabsEl = document.getElementById('secondaryTabs');
  tabsEl.innerHTML = '';

  dates.forEach(d => {
    const dt = parseMatchDate(d);
    const dayNum = d.split(' ')[0];
    const monthAbbr = d.split(' ')[1]?.slice(0,4) || '';
    const dn = dayNames[dt.getDay()];
    const count = datesMap[d].length;
    const isToday = d === todayStr;
    const isPast = parseMatchDate(d) < new Date() && !isToday;

    const btn = document.createElement('div');
    btn.className = 'date-tab' + (d === activeDate ? ' active' : '') + (isToday ? ' today' : '') + (isPast ? ' past' : '');
    btn.dataset.date = d;
    btn.innerHTML = `
      <span class="day-name">${dn}</span>
      <span class="day-num">${dayNum}</span>
      <span class="day-month">${monthAbbr}</span>
      ${isToday ? '<span class="today-dot"></span>' : `<span class="match-count">${count}</span>`}
    `;
    btn.onclick = () => switchDay(d);
    tabsEl.appendChild(btn);
  });

  // Build all panels
  const panelsEl = document.getElementById('dayPanels');
  panelsEl.innerHTML = '';

  dates.forEach(d => {
    const panel = document.createElement('div');
    panel.id = 'panel_' + d.replace(/ /g,'_');
    panel.style.display = (d === activeDate) ? 'block' : 'none';

    const matchesOfDay = datesMap[d];
    const dt = parseMatchDate(d);
    const dayNames2 = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const longDay = dayNames2[dt.getDay()];
    const isToday = d === todayStr;

    let html = `
      <div class="day-header">
        <div>
          <div style="font-size:0.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px">${longDay}</div>
          <h2>${d} 2026 ${isToday ? '<span class="today-badge">AUJOURD\'HUI</span>' : ''}</h2>
        </div>
        <span class="pill">${matchesOfDay.length} match${matchesOfDay.length > 1 ? 's' : ''}</span>
      </div>
      <div class="matches-grid">`;
    matchesOfDay.forEach(({m,i}) => { html += buildMatchCard(m, i); });
    html += `</div>`;
    panel.innerHTML = html;
    panelsEl.appendChild(panel);
  });

  // Auto-scroll active tab into view
  setTimeout(() => {
    const activeTab = tabsEl.querySelector('.date-tab.active');
    if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }, 100);
}

function switchDay(date) {
  document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-date="${date}"]`).classList.add('active');
  document.querySelectorAll('#dayPanels > div').forEach(p => p.style.display = 'none');
  document.getElementById('panel_' + date.replace(/ /g,'_')).style.display = 'block';
}

async function fetchScorers() {
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{
          role: 'user',
          content: `Search for "FIFA World Cup 2026 top scorers goals" and return ONLY a valid JSON array, no markdown, no explanation:
[{"rank":1,"name":"Player Name","country":"Country","flag":"🏳️","goals":3,"assists":1},...]
List the top 10 scorers. If the tournament hasn't started or no goals yet, return players expected to be top scorers with goals:0.`
        }]
      })
    });
    const data = await resp.json();
    const text = data.content?.map(b => b.text || '').join('') || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const start = clean.indexOf('[');
    const end = clean.lastIndexOf(']');
    if (start !== -1 && end !== -1) {
      scorersData = JSON.parse(clean.slice(start, end + 1));
    } else {
      scorersData = getFallbackScorers();
    }
  } catch(e) {
    scorersData = getFallbackScorers();
  }
  scorersLoading = false;
  renderScorers();
}

        <div class="scorer-stats">
          <div class="scorer-goals">${s.goals} <span style="font-size:0.6rem;color:var(--muted)">BUT${s.goals>1?'S':''}</span></div>
          ${s.assists > 0 ? `<div class="scorer-assists">${s.assists} <span style="font-size:0.55rem;color:var(--muted)">PASSE${s.assists>1?'S':''}</span></div>` : ''}
        </div>
      </div>`;
  }).join('');

  const hasGoals = scorersData.some(s => s.goals > 0);
  const lastUpdate = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});

  document.getElementById('scorersBody').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <span class="pill">TOP 10</span>
      <span style="font-size:0.65rem;color:var(--muted)">Mis à jour à ${lastUpdate} · <button onclick="refreshScorers()" style="background:none;border:none;color:var(--teal);cursor:pointer;font-size:0.65rem;padding:0">↻ Actualiser</button></span>
    </div>
    ${!hasGoals ? `<div style="background:rgba(108,99,255,0.1);border:1px solid rgba(108,99,255,0.25);border-radius:12px;padding:0.75rem 1rem;margin-bottom:1rem;font-size:0.75rem;color:#a99fff">
      ⏳ Le tournoi n'a pas encore débuté — voici les favoris attendus au classement des buteurs.
    </div>` : ''}
    <div class="scorers-list">${rows}</div>`;
}

async function refreshScorers() {
  scorersLoading = false;
  renderScorersShell();
  scorersLoading = true;
  await fetchScorers();
}

// ═══════════════════════════════════════════════════════════
// BUILD STANDINGS (group tabs + tables)
// ═══════════════════════════════════════════════════════════
let currentStandingsGroup = 'A';

function buildStandingsNav() {
  const tabsEl=document.getElementById('secondaryTabs');
  tabsEl.innerHTML='';
  Object.keys(GROUPS).forEach(gid=>{
    const btn=document.createElement('div');
    btn.className='group-tab'+(gid===currentStandingsGroup?' active':'');
    btn.dataset.group=gid;
    btn.textContent='Groupe '+gid;
    btn.onclick=()=>switchStandingsGroup(gid);
    tabsEl.appendChild(btn);
  });
}

function switchStandingsGroup(gid) {
  currentStandingsGroup=gid;
  document.querySelectorAll('.group-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.group-tab[data-group="${gid}"]`).classList.add('active');
  renderStandingsGroup(gid);
}

function renderStandingsGroup(gid) {
  const g=GROUPS[gid];
  const standings=computeStandings(gid);

  // Also list group matches
  const groupMatches=MATCHES_GROUP.map((m,i)=>({m,i})).filter(({m})=>m.group===gid);

  let matchesHtml='';
  groupMatches.forEach(({m,i})=>{ matchesHtml+=buildMatchCard(m,i,false,true); });

  const tableRows=standings.map((s,rank)=>{
    const team=g.teams[s.idx];
    const flag=g.flags[s.idx];
    const diff=s.diff;
    const diffStr=diff>0?`+${diff}`:String(diff);
    const diffCls=diff>0?'diff-pos':diff<0?'diff-neg':'diff-zero';
    const posCls=rank<2?'qualified':rank===2?'playoff':'';
    return `<tr>
      <td><div class="team-cell">
        <span class="pos ${posCls}">${rank+1}</span>
        <span class="mini-flag">${flag}</span>
        <span class="tname">${team}</span>
      </div></td>
      <td>${s.played}</td>
      <td>${s.w}</td>
      <td>${s.d}</td>
      <td>${s.l}</td>
      <td>${s.gf}</td>
      <td>${s.ga}</td>
      <td class="${diffCls}">${diffStr}</td>
      <td class="pts-cell">${s.pts}</td>
    </tr>`;
  }).join('');

  document.getElementById('standingsContent').innerHTML=`
    <div class="standings-wrap">
      <div class="standings-header">
        <h2>Groupe ${gid}</h2>
        <span class="pill">${g.name}</span>
      </div>

      <div style="background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.5rem;">
        <div style="display:flex;align-items:center;gap:0.6rem;padding:0.85rem 1.1rem;border-bottom:1px solid var(--border);">
          <div class="group-color-dot gc-${gid}"></div>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px">Classement</span>
        </div>
        <table class="standings-table">
          <thead><tr>
            <th>Équipe</th><th>J</th><th>V</th><th>N</th><th>D</th>
            <th>BP</th><th>BC</th><th>DB</th><th>PTS</th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
        <div class="qual-legend">
          <span><span class="qual-dot" style="background:#00D4AA"></span>Qualifié (1er/2e)</span>
          <span><span class="qual-dot" style="background:#FFB347"></span>Possible 3e qualifié</span>
        </div>
      </div>

      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;margin-bottom:0.75rem;color:var(--muted)">
        MATCHS DU GROUPE
      </div>
      <div class="matches-grid">${matchesHtml}</div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════
// BUILD KNOCKOUT
// ═══════════════════════════════════════════════════════════
function buildKnockout(phaseId) {
  const phase=KNOCKOUT_PHASES.find(p=>p.id===phaseId);
  if(!phase) return;
  let html=`<div class="section-title">${phase.label}</div><div class="knockout-grid">`;
  phase.matches.forEach((m,i)=>{ html+=buildMatchCard(m,i,true,true); });
  html+=`</div>`;
  document.getElementById('knockoutContent').innerHTML=html;
}

// ═══════════════════════════════════════════════════════════
// MAIN NAV SWITCH
// ═══════════════════════════════════════════════════════════
let currentMain='calendar';

function switchMain(view, btn) {
  currentMain=view;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  ['calendar','standings','knockout'].forEach(v=>{
    document.getElementById('view-'+v).classList.remove('active');
  });

  const tabsEl=document.getElementById('secondaryTabs');
  const secondaryWrap=document.getElementById('secondaryNavWrap');

  if(view==='calendar'){
    document.getElementById('view-calendar').classList.add('active');
    secondaryWrap.style.display='';
    buildCalendar();
  } else if(view==='standings'){
    document.getElementById('view-standings').classList.add('active');
    secondaryWrap.style.display='';
    buildStandingsNav();
    renderStandingsGroup(currentStandingsGroup);
  } else {
    document.getElementById('view-knockout').classList.add('active');
    secondaryWrap.style.display='none';
    buildKnockout(view);
  }
}

// ═══════════════════════════════════════════════════════════
// SCORE MODAL
// ═══════════════════════════════════════════════════════════
function openScore(key, homeName, awayName) {
  const res=results[key]||{};
  const existing=res.hasOwnProperty('h');

  const modal=document.createElement('div');
  modal.id='scoreModal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;';
  modal.innerHTML=`
    <div style="background:#1A1D2E;border:1.5px solid rgba(255,255,255,0.12);border-radius:20px;padding:2rem;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.6);">
      <h3 style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;margin-bottom:0.4rem;color:#00D4AA">
        ${existing?'✏️ Modifier':'⚽ Saisir'} le Score
      </h3>
      <p style="font-size:0.75rem;color:#7B82A8;margin-bottom:1.5rem;">${homeName} · vs · ${awayName}</p>
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.75rem;">
        <div style="flex:1;text-align:center">
          <div style="font-size:0.65rem;color:#7B82A8;margin-bottom:0.5rem;letter-spacing:1px;text-transform:uppercase">${homeName}</div>
          <input id="scoreH" type="number" min="0" max="20" value="${existing?res.h:''}" placeholder="0"
            style="width:72px;height:56px;background:#0F1117;border:2px solid #6C63FF;border-radius:12px;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:2.2rem;text-align:center;outline:none;">
        </div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:#7B82A8">—</div>
        <div style="flex:1;text-align:center">
          <div style="font-size:0.65rem;color:#7B82A8;margin-bottom:0.5rem;letter-spacing:1px;text-transform:uppercase">${awayName}</div>
          <input id="scoreA" type="number" min="0" max="20" value="${existing?res.a:''}" placeholder="0"
            style="width:72px;height:56px;background:#0F1117;border:2px solid #6C63FF;border-radius:12px;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:2.2rem;text-align:center;outline:none;">
        </div>
      </div>
      <div style="display:flex;gap:0.65rem;">
        <button onclick="saveScore('${key}')" style="flex:1;background:linear-gradient(135deg,#6C63FF,#00D4AA);color:#fff;border:none;padding:0.8rem;border-radius:12px;font-weight:700;font-size:0.8rem;cursor:pointer;letter-spacing:1px">ENREGISTRER</button>
        ${existing?`<button onclick="clearScore('${key}')" style="background:rgba(255,107,107,0.12);color:#FF6B6B;border:1.5px solid #FF6B6B;padding:0.8rem 1rem;border-radius:12px;font-weight:600;font-size:0.75rem;cursor:pointer">EFFACER</button>`:''}
        <button onclick="closeModal()" style="background:rgba(255,255,255,0.06);color:#7B82A8;border:none;padding:0.8rem 1rem;border-radius:12px;font-weight:600;font-size:0.75rem;cursor:pointer">ANNULER</button>
      </div>
    </div>`;
  modal.onclick=e=>{ if(e.target===modal) closeModal(); };
  document.body.appendChild(modal);
  setTimeout(()=>document.getElementById('scoreH')?.focus(),80);
}

function closeModal(){ document.getElementById('scoreModal')?.remove(); }

async function saveScore(key){
  const h=parseInt(document.getElementById('scoreH').value);
  const a=parseInt(document.getElementById('scoreA').value);
  if(isNaN(h)||isNaN(a)) return;
  results[key]={h,a};
  await saveResults();
  closeModal();
  refreshView();
}
async function clearScore(key){
  delete results[key];
  await saveResults();
  closeModal();
  refreshView();
}

function refreshView(){
  if(currentMain==='calendar') buildCalendar();
  else if(currentMain==='standings'){ buildStandingsNav(); renderStandingsGroup(currentStandingsGroup); }
  else buildKnockout(currentMain);
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init(){
  await loadResults();
  buildCalendar();
}
init();
</script>
</body>
</html>
